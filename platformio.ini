; Reifendruck-Display – PlatformIO-Projekt
;
; Empfohlen:  M5Stack Core2           pio run -e m5core2 -t upload
;             M5Stack CoreS3          pio run -e m5cores3 -t upload
; Selbstbau:  ESP32-C3 + 1,3" OLED     pio run -e esp32c3 -t upload
; Log:        pio device monitor
; Tests (PC): pio test -e native

[platformio]
default_envs = m5core2

[esp32_common]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200

; ---------------------------------------------------------------- M5Stack Core2 / CoreS3
[m5core_common]
extends = esp32_common
build_src_filter = +<core/>
lib_deps =
  h2zero/NimBLE-Arduino@^1.4.3
  m5stack/M5Unified@^0.3.0
  m5stack/M5GFX@^0.3.0

; M5Stack Core2 (v1.1 / v1.3) – empfohlen
[env:m5core2]
extends = m5core_common
board = m5stack-core2
board_build.partitions = default_16MB.csv

; M5Stack CoreS3 (mit Lagesensor) bzw. CoreS3 SE (ohne – dann Unit IMU an Port A)
[env:m5cores3]
extends = m5core_common
board = m5stack-cores3
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; ---------------------------------------------------------------- Selbstbau mit OLED
[oled_common]
extends = esp32_common
build_src_filter = +<oled/>
lib_deps =
  h2zero/NimBLE-Arduino@^1.4.3
  olikraus/U8g2@^2.35.30

; ESP32-C3 "SuperMini"
[env:esp32c3]
extends = oled_common
board = esp32-c3-devkitm-1
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; Klassisches ESP32-DevKit (WROOM-32)
[env:esp32dev]
extends = oled_common
board = esp32dev
build_flags =
  -DPIN_I2C_SDA=21
  -DPIN_I2C_SCL=22
  -DPIN_ENC_A=32
  -DPIN_ENC_B=33
  -DPIN_ENC_BTN=25
  -DPIN_BUZZER=26

; ---------------------------------------------------------------- Tests am PC
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
