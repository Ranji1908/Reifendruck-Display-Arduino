; Reifendruck-Display – PlatformIO-Projekt
; Flashen:        pio run -e esp32c3 -t upload
; Serieller Log:  pio device monitor
; Tests am PC:    pio test -e native

[platformio]
default_envs = esp32c3

[esp32_common]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
lib_deps =
  h2zero/NimBLE-Arduino@^1.4.3
  olikraus/U8g2@^2.35.30

; ESP32-C3 "SuperMini" (empfohlen: winzig, BLE 5, USB-C)
[env:esp32c3]
extends = esp32_common
board = esp32-c3-devkitm-1
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; Klassisches ESP32-DevKit (WROOM-32) als Alternative
[env:esp32dev]
extends = esp32_common
board = esp32dev
build_flags =
  -DPIN_I2C_SDA=21
  -DPIN_I2C_SCL=22
  -DPIN_ENC_A=32
  -DPIN_ENC_B=33
  -DPIN_ENC_BTN=25
  -DPIN_BUZZER=26

; Kernlogik-Tests auf dem PC
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
